## For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
#
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx1024m -XX:MaxPermSize=256m
# org.gradle.jvmargs=-Xmx2048m -XX:MaxPermSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
#
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true
#Sat Nov 19 15:59:34 CST 2022

org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8 -Djava.awt.headless=true -XX:+UseParallelGC
kotlin.daemon.jvmargs=-Xmx4096M -Djava.awt.headless=true
android.useAndroidX=true
android.enableJetifier=false
# R8 full mode is the default since AGP 8.0, but set it explicitly so the intent is
# documented and to guard against any future AGP default change. Full mode enables more
# aggressive shrinking (stricter type analysis, dead-code elimination, deeper inlining)
# than the legacy compat mode — typically reduces DEX size by 5–10% on top of the existing
# `-keep` rules. All reflection entry points are already covered by proguard-rules.pro.
android.enableR8.fullMode=true
org.gradle.configuration-cache=true
org.gradle.unsafe.configuration-cache=true
org.gradle.configuration-cache.problems=warn
org.gradle.ide.support.future.agp.versions=true
android.nonTransitiveRClass=false

# Jetifier is disabled - no need for ignorelist

# Performance improvements
org.gradle.parallel=true
org.gradle.daemon=true
org.gradle.configureondemand=false

# Suppress deprecated warnings
android.suppressUnsupportedOptionWarnings=android.suppressUnsupportedOptionWarnings,android.nonFinalResIds

# Increase timeouts for JitPack downloads (fixes timeout issues with NewPipeExtractor)
systemProp.org.gradle.internal.http.connectionTimeout=180000
systemProp.org.gradle.internal.http.socketTimeout=180000

# Disable caching for SNAPSHOT dependencies to avoid timeout issues
org.gradle.caching=false

# Fix KSP IllegalStateException: Storage for [...] is already registered
ksp.incremental=false
