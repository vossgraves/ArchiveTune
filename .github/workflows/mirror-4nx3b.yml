name: Mirror 4nx3b stable releases

# Mirrors 4nx3b/ArchiveTune onto this fork whenever they publish a STABLE release, so this repo
# ships the same code under the same version number with the same release notes.
#
# THIS IS NOW THE ONLY WORKFLOW THAT OWNS dev
# -------------------------------------------
# upstream-sync.yml (hourly rukamori merge) and upstream-sync-merge.yml have been deleted. They
# tracked rukamori/ArchiveTune directly, fought this workflow for ownership of dev -- every mirror
# was partly undone by the next hourly merge -- and flooded the Actions log with hourly no-op runs.
#
# Mirroring 4nx3b already includes rukamori's work transitively, because 4nx3b syncs from rukamori
# themselves, so nothing is lost by removing them. This workflow replaces the tree outright rather
# than merging, because merging can never produce a matching version number (see VERSION PARITY).
#
# WHY .github/ IS PRESERVED INSTEAD OF MIRRORED
# --------------------------------------------
# GitHub only runs scheduled workflows from the repository's default branch. A literal mirror of
# every path would overwrite .github/workflows with theirs, deleting this file and release.yml
# along with it -- the mirror would run exactly once and then be gone, and because release.yml
# exists only on main it would not come back from dev either. So the sync replaces all application
# code and build config, then restores this fork's .github/. Everything a user can install is
# identical; only the automation differs.
#
# VERSION PARITY
# --------------
# release.yml normally derives the version from `git rev-list --count HEAD`, so matching their
# version would require byte-identical history -- impossible while this fork carries any commit of
# its own, including this file. Instead the sync records their exact tag in .mirror-release.json
# and release.yml prefers that over the commit count, so the version matches by construction.

on:
  # Schedule re-enabled. The earlier concern was that the first two scheduled runs pushed a main
  # with every submodule gitlink deleted; the gitlink restore step below fixes that and asserts on
  # it, and this workflow no longer races upstream-sync.yml for dev (that workflow is deleted).
  #
  # This still force-pushes main every two hours, so the gitlink assertion is the safety net: it
  # fails the run before pushing if any submodule gitlink would be dropped.
  schedule:
    - cron: '43 */2 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Mirror a specific tag instead of their latest stable (e.g. v14.0.5362)'
        required: false
        type: string
      dry_run:
        description: 'Resolve and diff only -- do not push anything'
        required: false
        type: boolean
        default: false

concurrency:
  # Never let two mirrors race: both rewrite main, and a lost race would publish a tree that is
  # half one release and half another.
  group: mirror-4nx3b
  cancel-in-progress: false

permissions:
  contents: write

env:
  UPSTREAM: 4nx3b/ArchiveTune
  UPSTREAM_URL: https://github.com/4nx3b/ArchiveTune.git

jobs:
  resolve:
    name: Resolve upstream release
    runs-on: ubuntu-latest
    outputs:
      should_mirror: ${{ steps.pick.outputs.should_mirror }}
      tag: ${{ steps.pick.outputs.tag }}
      version: ${{ steps.pick.outputs.version }}
      version_code: ${{ steps.pick.outputs.version_code }}
    steps:
      # Checked here rather than in the mirror job, where an empty `token:` on actions/checkout
      # fails as an opaque auth error after the tag has already been resolved.
      - name: Require SYNC_PAT
        env:
          SYNC_PAT: ${{ secrets.SYNC_PAT }}
        run: |
          if [ -z "${SYNC_PAT:-}" ]; then
            echo "::error::SYNC_PAT is not set. The mirror pushes with it so release.yml fires;"
            echo "with the default GITHUB_TOKEN the push lands but no release is ever published."
            exit 1
          fi
          echo "SYNC_PAT present."

      - name: Pick their newest stable release
        id: pick
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WANTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [ -n "${WANTED_TAG:-}" ]; then
            # Manual re-run of a specific tag. Ask for it directly so a typo fails loudly here
            # instead of silently mirroring whatever is newest.
            if ! REL_JSON="$(gh api "repos/${UPSTREAM}/releases/tags/${WANTED_TAG}" 2>/dev/null)"; then
              echo "::error::No release found on ${UPSTREAM} with tag '${WANTED_TAG}'."
              exit 1
            fi
          else
            # Newest non-draft release, stable or not. Originally this required
            # draft==false && prerelease==false, but 4nx3b has -- so far -- only ever published
            # prereleases (tag names like N202608091717); with the stable-only filter should_mirror
            # was false on every single scheduled run and nothing was ever mirrored. Prereleases are
            # still a published, tagged build (not a draft), so treat them as mirror-worthy too. The
            # API returns releases newest first, so the first non-draft match is the one to take.
            REL_JSON="$(gh api "repos/${UPSTREAM}/releases" --paginate \
              --jq '[.[] | select(.draft==false)][0] // empty')"
            if [ -z "$REL_JSON" ]; then
              echo "No release published on ${UPSTREAM} yet -- nothing to mirror."
              echo "should_mirror=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          TAG="$(printf '%s' "$REL_JSON" | jq -r '.tag_name')"
          REL_NAME="$(printf '%s' "$REL_JSON" | jq -r '.name // ""')"

          # Two tag/name shapes have been observed on 4nx3b:
          #   stable:  tag v<major>.<minor>.<commitcount>              (e.g. v14.0.5362)
          #   canary:  tag N<timestamp>, name "Canary <version>-<sha> (<build>)"
          #            (e.g. tag N202608091717, name "Canary 14.0.5682-6a3bf2e01 (202608091717)")
          # The canary tag itself carries no version at all -- stripping a leading v from
          # "N202608091717" is a no-op, and the old commitcount extraction would take the whole
          # string as VERSION_CODE and fail the integer check below. Prefer whatever's embedded in
          # the release name when the tag doesn't already look like v<ver>, since that's where 4nx3b
          # actually puts the version for their only release type so far.
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            VERSION="${TAG#v}"
          elif [[ "$REL_NAME" =~ ([0-9]+\.[0-9]+\.[0-9]+) ]]; then
            VERSION="${BASH_REMATCH[1]}"
          else
            echo "::error::Could not find a <major>.<minor>.<commitcount> version in tag '${TAG}' or name '${REL_NAME}'."
            exit 1
          fi

          # versionCode must be a positive integer or Android refuses the upgrade. Both shapes end
          # in the commit count as the final dot-segment.
          VERSION_CODE="${VERSION##*.}"
          if ! printf '%s' "$VERSION_CODE" | grep -qE '^[0-9]+$'; then
            echo "::error::Could not derive an integer versionCode from version '${VERSION}' (tag '${TAG}')."
            exit 1
          fi

          # Skip if this fork already published that tag, which makes the schedule idempotent.
          if gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Already released ${TAG} here -- nothing to do."
            echo "should_mirror=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Will mirror ${UPSTREAM} ${TAG} (version ${VERSION}, code ${VERSION_CODE})."
          {
            echo "should_mirror=true"
            echo "tag=${TAG}"
            echo "version=${VERSION}"
            echo "version_code=${VERSION_CODE}"
          } >> "$GITHUB_OUTPUT"

  mirror:
    name: Mirror ${{ needs.resolve.outputs.tag }}
    needs: resolve
    if: needs.resolve.outputs.should_mirror == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this fork
        uses: actions/checkout@v7
        with:
          # Full history: the push to main must be a descendant of main, and release.yml still
          # reads history for its changelog range.
          fetch-depth: 0
          ref: main
          persist-credentials: true
          # Push with the PAT, not the default GITHUB_TOKEN.
          #
          # GitHub deliberately does not run workflows for pushes made with GITHUB_TOKEN, to stop
          # runaway loops. That is why the first two mirror runs landed upstream's tree on main and
          # published nothing: release.yml never fired, leaving main at v14.0.5362 while the newest
          # release was still v14.0.5328. persist-credentials writes this token into the remote, so
          # the pushes at the end of this job inherit it.
          #
          # Loop safety comes from release.yml and build.yml ignoring [mirror] commits, plus the
          # tag-already-released guard in resolve -- not from the token being powerless.
          token: ${{ secrets.SYNC_PAT }}

      - name: Fetch their tag
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          git remote add anx "${UPSTREAM_URL}" 2>/dev/null || git remote set-url anx "${UPSTREAM_URL}"
          # Fetch only the tag being mirrored, into a namespaced ref that cannot collide with the
          # tag this fork is about to create for its own release.
          git fetch --no-tags anx "refs/tags/${TAG}:refs/mirror/${TAG}"
          echo "Their tree: $(git rev-parse --short "refs/mirror/${TAG}")"

      - name: Replace tree with theirs, keeping this fork's .github
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail

          # Extract their tree to a scratch dir rather than checking it out over the top: a
          # checkout leaves behind files they deleted, which would make this a merge rather than a
          # mirror and could resurrect code their release does not contain.
          rm -rf /tmp/upstream_tree && mkdir -p /tmp/upstream_tree
          git archive "refs/mirror/${TAG}" | tar -x -C /tmp/upstream_tree

          # Preserve this fork's automation. See the header comment for why this is not mirrored.
          rm -rf /tmp/keep_github && cp -a .github /tmp/keep_github

          # Clear the working tree, then lay theirs down. Dropping tracked paths through git keeps
          # the index honest; the find pass clears anything untracked a previous build left behind.
          git rm -rq --cached . >/dev/null
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +

          cp -a /tmp/upstream_tree/. .

          # Restore submodule gitlinks.
          #
          # `git archive` silently omits submodules -- it emits an empty directory for each gitlink
          # and no mode-160000 entries at all. Together with the `git rm --cached .` above, that
          # staged the DELETION of all five (core, lyrics, IconPack, moriextractor,
          # morideobfuscator) and pushed a main that cannot build: settings.gradle.kts includes
          # :core, :lyrics et al, and Gradle fails when their directories do not exist.
          #
          # .gitmodules survives, being an ordinary file, which is what makes this easy to miss --
          # the config looks intact while every pointer is gone.
          #
          # Gitlinks cannot be written through the worktree, so re-stage them into the index
          # directly from upstream's tree, which is the authority for what each pointer should be.
          GITLINKS="$(git ls-tree "refs/mirror/${TAG}" | awk '$2 == "commit" { print $3 "\t" $4 }')"
          if [ -z "$GITLINKS" ]; then
            echo "::error::No submodule gitlinks found in refs/mirror/${TAG}."
            echo "Upstream has always had five; an empty list means the tag or fetch is wrong."
            exit 1
          fi

          while IFS=$'\t' read -r sha path; do
            [ -n "$path" ] || continue
            rm -rf "$path"
            git update-index --add --cacheinfo "160000,${sha},${path}"
            echo "  gitlink ${path} -> ${sha:0:9}"
          done <<< "$GITLINKS"

          rm -rf .github
          cp -a /tmp/keep_github .github

          # Repoint the in-app updater at this fork.
          #
          # Upstream hardcodes their own repo in Updater.OWNER, correctly for them. Mirroring it
          # verbatim ships an app that offers users an APK signed with upstream's keystore, and
          # since applicationId is identical across ArchiveTune forks Android rejects that install
          # as INSTALL_FAILED_UPDATE_INCOMPATIBLE -- the download succeeds and the install fails,
          # so it looks like a broken updater. Preserving .github/ is not enough; this line is app
          # source, and the mirror has already reverted it once.
          UPDATER=app/src/main/kotlin/moe/rukamori/archivetune/utils/Updater.kt
          if [ ! -f "$UPDATER" ]; then
            echo "::error::${UPDATER} not found -- upstream moved it. Repoint Updater.OWNER before mirroring."
            exit 1
          fi
          sed -i -E 's|^(\s*private const val OWNER = ")[^"]+(")|\1'"${GITHUB_REPOSITORY}"'\2|' "$UPDATER"
          if ! grep -q "private const val OWNER = \"${GITHUB_REPOSITORY}\"" "$UPDATER"; then
            echo "::error::Failed to repoint Updater.OWNER -- the declaration changed shape upstream."
            echo "Found: $(grep -n 'const val OWNER' "$UPDATER" || echo '<none>')"
            exit 1
          fi
          echo "Updater.OWNER repointed to ${GITHUB_REPOSITORY}."

          git add -A

          # `git add -A` must not have re-flattened the gitlinks staged above. Assert against the
          # index rather than the worktree, since that is what actually gets committed, and compare
          # to upstream's count so a submodule being added or removed upstream surfaces here rather
          # than as a broken build.
          WANT="$(printf '%s\n' "$GITLINKS" | grep -c . || true)"
          HAVE="$(git ls-files --stage | awk '$1 == "160000"' | wc -l)"
          if [ "$HAVE" -ne "$WANT" ]; then
            echo "::error::Expected ${WANT} submodule gitlinks in the index, found ${HAVE}."
            echo "Refusing to push a tree whose submodules would be deleted."
            git ls-files --stage | awk '$1 == "160000" { print "  have: " $4 }'
            exit 1
          fi
          echo "Verified ${HAVE} submodule gitlinks staged."

          echo "Staged $(git diff --cached --name-only | wc -l) changed paths."

      - name: Record their release for release.yml
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
          VERSION_CODE: ${{ needs.resolve.outputs.version_code }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          REL="$(gh api "repos/${UPSTREAM}/releases/tags/${TAG}")"
          BODY="$(printf '%s' "$REL" | jq -r '.body // ""')"
          NAME="$(printf '%s' "$REL" | jq -r '.name // ""')"

          # Point repo and download links at this fork: it attaches its own APKs, signed with its
          # own key, and a verbatim link would send users to their binaries instead.
          BODY="${BODY//4nx3b\/ArchiveTune/${GITHUB_REPOSITORY}}"

          # A bare "#123" would auto-link to an unrelated issue of the same number in this repo.
          # Qualify them so they still resolve to the pull request actually being described.
          BODY="$(printf '%s' "$BODY" | sed -E 's@(^|[^A-Za-z0-9_/-])#([0-9]+)@\1'"${UPSTREAM}"'#\2@g')"

          # Written as JSON so release.yml can read the body without shell-quoting hazards: their
          # notes contain backticks, quotes and newlines.
          jq -n \
            --arg tag "$TAG" \
            --arg version "$VERSION" \
            --arg version_code "$VERSION_CODE" \
            --arg name "$NAME" \
            --arg body "$BODY" \
            --arg source "$UPSTREAM" \
            '{tag:$tag, version:$version, version_code:$version_code, name:$name, body:$body, source:$source}' \
            > .mirror-release.json

          git add .mirror-release.json
          echo "Recorded ${TAG}."

      - name: Show what changed
        run: |
          set -euo pipefail
          {
            echo "### Mirroring ${{ needs.resolve.outputs.tag }} from ${UPSTREAM}"
            echo '```'
            git diff --cached --stat | tail -40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # Only the marker changing means their tree already matches this one; still worth
          # committing so the version lands and the release fires.
          if [ -z "$(git diff --cached --name-only | grep -v '^\.mirror-release\.json$' || true)" ]; then
            echo "Note: only the release marker changed -- trees already match." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit and push
        if: ${{ !inputs.dry_run }}
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if git diff --cached --quiet; then
            echo "Nothing staged -- skipping commit."
            exit 0
          fi

          # [mirror] is load-bearing: other push-triggered jobs can filter on it, and it makes the
          # history readable as "this came from them, not from me".
          git commit --no-verify -q \
            -m "chore(mirror): sync ${UPSTREAM} at ${TAG} [mirror]" \
            -m "Replaces application code and build config with their ${TAG} tree, keeping this fork's .github/ so this workflow and release.yml survive. Version and notes come from their release via .mirror-release.json."

          # dev first: if main is protected and rejects the push, dev still reflects the sync and
          # the failure is visible rather than silent.
          git push origin HEAD:refs/heads/dev --force
          git push origin HEAD:refs/heads/main --force

          echo "Pushed ${TAG}. release.yml will publish v${VERSION}."

      - name: Dry run notice
        if: ${{ inputs.dry_run }}
        run: echo "Dry run -- resolved ${{ needs.resolve.outputs.tag }} and staged the tree, pushed nothing."
