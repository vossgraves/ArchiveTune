name: Build Pull Request

on:
  pull_request:
    branches:
      - "**"

concurrency:
  # One in-flight build per PR. Without this, pushing several commits in quick succession leaves
  # every obsolete build queued and competing for runners, so the commit you actually care about
  # waits behind builds whose result is already irrelevant.
  group: pr-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: "temurin"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
          cache-cleanup: on-success

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate debug.keystore if not exists
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      # Cheapest gate first: ktlint parses sources without compiling them, so a stale
      # import fails here in seconds rather than after a full assemble.
      #
      # The task-list assertion is deliberate. ktlint-gradle only registers its source-set
      # tasks if it detects a Kotlin plugin on the project, and :app gets Kotlin via AGP
      # rather than an explicit kotlin-android alias. If that detection ever stops working,
      # `ktlintCheck` would succeed while checking zero files -- a gate that silently passes
      # everything. Failing when the per-source-set tasks are absent keeps that honest.
      - name: Lint (ktlint)
        shell: bash
        run: |
          set -euo pipefail
          if ! ./gradlew --console=plain :app:tasks --all -q | grep -qE '^ktlint\w+SourceSetCheck'; then
            echo "::error::ktlint registered no source-set check tasks for :app -- the lint gate is not actually running."
            exit 1
          fi
          ./gradlew --console=plain :app:ktlintCheck --warning-mode summary

      # Runs before the APK build: unit tests compile a fraction of the project, so a broken
      # assertion surfaces in well under a minute instead of after a full assemble+lint.
      - name: Unit Tests
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --console=plain :app:testGmsMobileUniversalDebugUnitTest --warning-mode summary
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          API_BEARER_TOKEN: ${{ secrets.API_BEARER_TOKEN }}
          CANVAS_BEARER_TOKEN: ${{ secrets.CANVAS_BEARER_TOKEN }}
          EXTRACTOR_BEARER: ${{ secrets.EXTRACTOR_BEARER }}

      - name: Upload Unit Test Report
        # Only useful when something failed, and the report is what makes the failure diagnosable
        # without re-running locally.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          retention-days: 7

      - name: Build and Lint Mobile Universal Debug APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --console=plain assembleGmsMobileUniversalDebug :app:lintGmsMobileUniversalDebug --warning-mode summary 2>&1 | python3 -c "import re,sys;p=re.compile(r'^(WARNING: )?\[CXX5202\] This app only has 32-bit \[(armeabi-v7a|x86)\] native libraries\. Beginning August 1, 2019 Google Play store requires that all apps that include native libraries must provide 64-bit versions\. For more information, visit https://g\.co/64-bit-requirement\$');[sys.stdout.write(l) for l in sys.stdin if not p.match(l.rstrip())]"
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST: "true"
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          API_BEARER_TOKEN: ${{ secrets.API_BEARER_TOKEN }}
          CANVAS_BEARER_TOKEN: ${{ secrets.CANVAS_BEARER_TOKEN }}
          EXTRACTOR_BEARER: ${{ secrets.EXTRACTOR_BEARER }}

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: app-mobile-universal-debug-pr-${{ github.event.number }}
          path: |
            app/build/outputs/apk/gms/mobile/universal/debug/*.apk
            app/build/outputs/apk/gmsMobileUniversal/debug/*.apk
            app/build/outputs/apk/mobile/universal/debug/*.apk
            app/build/outputs/apk/mobileUniversal/debug/*.apk
