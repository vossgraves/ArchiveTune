name: Upstream Sync Merge

# Merges AI-resolved sync PRs once the PR build CI passes — no "auto-merge"
# repo setting required. Fires when the "Build Pull Request" workflow finishes;
# if the PR branch is a sync/auto-* branch and the build succeeded, merge it.

on:
  workflow_run:
    workflows: ["Build Pull Request"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  merge-on-green:
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'sync/auto-')
    steps:
      - name: Merge sync PR
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          PR=$(gh pr list -R ${{ github.repository }} --head "$HEAD_BRANCH" --base dev --state open --json number --jq '.[0].number')
          if [ -z "$PR" ]; then
            echo "No open sync PR for $HEAD_BRANCH (already merged or closed) — nothing to do."
            exit 0
          fi
          gh pr merge -R ${{ github.repository }} "$PR" --merge --delete-branch
          echo "Merged sync PR #$PR ($HEAD_BRANCH)"

  comment-on-red:
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion != 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'sync/auto-')
    steps:
      - name: Comment on failed sync PR
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          PR=$(gh pr list -R ${{ github.repository }} --head "$HEAD_BRANCH" --base dev --state open --json number --jq '.[0].number')
          [ -n "$PR" ] || exit 0
          gh pr comment -R ${{ github.repository }} "$PR" --body "The PR build CI failed ($RUN_URL), so this sync PR was NOT auto-merged. Review the build log; the merge commit remains on the \`$HEAD_BRANCH\` branch and the pre-sync backup branch is intact."
