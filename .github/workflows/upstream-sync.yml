name: Upstream Sync

# Automatically keeps this fork's `dev` branch in sync with rukamori/ArchiveTune `dev`.
# - Clean merges are pushed straight to dev (after a green debug-APK build).
# - Conflict-heavy merges are resolved by AI (see scripts/ai_resolve.py), gated on
#   a green build, then delivered as a self-merging PR.
# Docs: docs/UPSTREAM_SYNC.md

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  models: read

concurrency:
  group: upstream-sync
  cancel-in-progress: false

env:
  AI_BASE_URL: ${{ vars.AI_BASE_URL || 'https://opencode.ai/zen/go/v1' }}
  AI_MODEL: ${{ vars.AI_MODEL || 'kimi-k3' }}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      result: ${{ steps.sync.outputs.result }}
    steps:
      - name: Preflight secrets check
        env:
          SYNC_PAT: ${{ secrets.SYNC_PAT }}
        run: |
          if [ -z "$SYNC_PAT" ]; then
            echo "::error::SYNC_PAT secret is not set. See docs/UPSTREAM_SYNC.md (Setup) for instructions."
            exit 1
          fi

      - name: Checkout dev
        uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.SYNC_PAT }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success

      - name: Generate debug.keystore
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run upstream sync
        id: sync
        run: bash scripts/upstream_sync.sh
        env:
          SYNC_PAT: ${{ secrets.SYNC_PAT }}
          GH_TOKEN: ${{ secrets.SYNC_PAT }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ env.AI_BASE_URL }}
          AI_MODEL: ${{ env.AI_MODEL }}
          MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          API_BEARER_TOKEN: ${{ secrets.API_BEARER_TOKEN }}
          CANVAS_BEARER_TOKEN: ${{ secrets.CANVAS_BEARER_TOKEN }}
          EXTRACTOR_BEARER: ${{ secrets.EXTRACTOR_BEARER }}

      - name: Open self-merging PR (AI-resolved sync)
        if: steps.sync.outputs.result == 'ai'
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT }}
          SYNC_BRANCH: ${{ steps.sync.outputs.branch }}
          BEHIND: ${{ steps.sync.outputs.behind }}
        run: |
          PR_URL=$(gh pr create \
            --base dev \
            --head "$SYNC_BRANCH" \
            --title "chore(sync): merge upstream/dev ($BEHIND commits, AI-resolved)" \
            --body-file /tmp/sync_report.md)
          echo "Opened PR: $PR_URL"
          gh pr merge --auto --merge "$PR_URL" || \
            gh pr comment "$PR_URL" --body "Could not enable auto-merge. Enable 'Allow auto-merge' in repo settings, or merge manually once CI is green."
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Report successful sync
        if: steps.sync.outputs.result == 'clean' || steps.sync.outputs.result == 'ai'
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT }}
          RESULT: ${{ steps.sync.outputs.result }}
          BEHIND: ${{ steps.sync.outputs.behind }}
        run: |
          gh issue create \
            --title "Upstream sync $(date +%Y-%m-%d): $BEHIND commits ($RESULT)" \
            --body-file /tmp/sync_report.md

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT }}
        run: |
          {
            echo "## Upstream sync FAILED ($(date -u +%Y-%m-%dT%H:%MZ))"
            echo
            echo "The automated sync run failed and **no changes were pushed to dev**."
            echo
            echo "- Run logs: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- A backup branch (backup/dev-auto-*) was pushed before any merge attempt."
            echo "- See docs/UPSTREAM_SYNC.md (Troubleshooting) for recovery steps."
          } > /tmp/sync_failure.md
          gh issue create \
            --title "Upstream sync FAILED $(date +%Y-%m-%d)" \
            --body-file /tmp/sync_failure.md
