name: Upstream Sync

# Automatically keeps this fork's `dev` branch in sync with rukamori/ArchiveTune `dev`.
# - Runs hourly, but does real work ONLY when upstream has new commits
#   (a no-change run is just a fetch + compare: ~30 seconds, no build).
# - Clean merges are pushed straight to dev (after a green debug-APK build).
# - Conflict-heavy merges are resolved by AI (see scripts/ai_resolve.py), gated on
#   a green build, then delivered as a PR that merges itself once CI passes.
# Docs: docs/UPSTREAM_SYNC.md

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  models: read

concurrency:
  group: upstream-sync
  cancel-in-progress: false

env:
  # Conflict resolver. NVIDIA NIM is OpenAI-compatible, so scripts/ai_resolve.py posts to
  # ${AI_BASE_URL}/chat/completions unchanged.
  #
  # kimi-k2.6 is the strongest coder available on NIM (80.2% SWE-bench Verified, vs 71.9%
  # for nemotron-3-ultra), which is what matters here: resolving a conflict hunk is a
  # mechanical code edit. It is free on NIM's developer tier, rate-limited at roughly
  # 40 req/min with no daily cap -- the resolver issues one request PER CONFLICT HUNK, so a
  # daily-capped free tier (OpenRouter allows 50/day) would spill mid-merge into the
  # GitHub Models fallback on any sizeable conflict.
  #
  # Replaces opencode zen kimi-k3, which cost $3.00/$15.00 per 1M tokens.
  # Both values are overridable by repo variables if this provider ever degrades.
  AI_BASE_URL: ${{ vars.AI_BASE_URL || 'https://integrate.api.nvidia.com/v1' }}
  AI_MODEL: ${{ vars.AI_MODEL || 'moonshotai/kimi-k2.6' }}
  # This job adds an `upstream` remote pointing at rukamori/ArchiveTune, and gh resolves
  # an unqualified `gh pr`/`gh issue` against `upstream` in PREFERENCE to `origin`. That
  # silently opened PRs and "sync FAILED" issues on the UPSTREAM maintainer's repo instead
  # of this fork. GH_REPO pins every gh call in this workflow to the fork, including any
  # added later, so never remove it. Individual calls also pass --repo for clarity.
  GH_REPO: ${{ github.repository }}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      result: ${{ steps.sync.outputs.result }}
    steps:
      - name: Preflight secrets check
        env:
          SYNC_PAT: ${{ secrets.SYNC_PAT }}
        run: |
          if [ -z "$SYNC_PAT" ]; then
            echo "::error::SYNC_PAT secret is not set. See docs/UPSTREAM_SYNC.md (Setup) for instructions."
            exit 1
          fi

      - name: Checkout dev
        uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ secrets.SYNC_PAT }}

      - name: Check for upstream changes
        id: check
        run: |
          git remote add upstream https://github.com/rukamori/ArchiveTune.git 2>/dev/null || true
          git fetch upstream dev --quiet
          BEHIND=$(git rev-list --count HEAD..upstream/dev)
          echo "dev is $BEHIND commit(s) behind upstream/dev"
          if [ "$BEHIND" -eq 0 ]; then
            echo "No upstream changes — skipping merge/build (no-op run)."
          fi
          echo "behind=$BEHIND" >> "$GITHUB_OUTPUT"

      - name: Update submodules
        if: steps.check.outputs.behind != '0'
        run: git submodule update --init --recursive

      - name: Set up JDK 21
        if: steps.check.outputs.behind != '0'
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin

      - name: Set up Gradle
        if: steps.check.outputs.behind != '0'
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success

      - name: Generate debug.keystore
        if: steps.check.outputs.behind != '0'
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run upstream sync
        if: steps.check.outputs.behind != '0'
        id: sync
        run: bash scripts/upstream_sync.sh
        env:
          SYNC_PAT: ${{ secrets.SYNC_PAT }}
          GH_TOKEN: ${{ secrets.SYNC_PAT }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ env.AI_BASE_URL }}
          AI_MODEL: ${{ env.AI_MODEL }}
          MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          API_BEARER_TOKEN: ${{ secrets.API_BEARER_TOKEN }}
          CANVAS_BEARER_TOKEN: ${{ secrets.CANVAS_BEARER_TOKEN }}
          EXTRACTOR_BEARER: ${{ secrets.EXTRACTOR_BEARER }}

      # `raced` is a clean merge that passed the build gate but could not fast-forward dev
      # because dev advanced during the run. It ships down the same self-merging PR path.
      - name: Open sync PR (AI-resolved or raced sync)
        if: steps.sync.outputs.result == 'ai' || steps.sync.outputs.result == 'raced'
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT }}
          SYNC_BRANCH: ${{ steps.sync.outputs.branch }}
          BEHIND: ${{ steps.sync.outputs.behind }}
          RESULT: ${{ steps.sync.outputs.result }}
        run: |
          if [ "$RESULT" = "raced" ]; then
            TITLE="chore(sync): merge upstream/dev ($BEHIND commits, dev moved mid-run)"
          else
            TITLE="chore(sync): merge upstream/dev ($BEHIND commits, AI-resolved)"
          fi
          PR_URL=$(gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base dev \
            --head "$SYNC_BRANCH" \
            --title "$TITLE" \
            --body-file /tmp/sync_report.md)
          echo "Opened PR: $PR_URL"
          gh pr comment --repo "$GITHUB_REPOSITORY" "$PR_URL" --body "This PR will be merged automatically by the 'Upstream Sync Merge' workflow once the Build Pull Request CI passes. No action needed unless CI fails."

      - name: Report successful sync
        if: steps.sync.outputs.result == 'clean' || steps.sync.outputs.result == 'ai' || steps.sync.outputs.result == 'raced'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT }}
          RESULT: ${{ steps.sync.outputs.result }}
          BEHIND: ${{ steps.sync.outputs.behind }}
        run: |
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "Upstream sync $(date +%Y-%m-%d): $BEHIND commits ($RESULT)" \
            --body-file /tmp/sync_report.md || \
            echo "::warning::Could not open the report issue (are Issues enabled on this repo?). Sync itself succeeded."

      - name: Report failure
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT }}
        run: |
          {
            echo "## Upstream sync FAILED ($(date -u +%Y-%m-%dT%H:%MZ))"
            echo
            echo "The automated sync run failed and **no changes were pushed to dev**."
            echo
            echo "- Run logs: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- A backup branch (backup/dev-auto-*) was pushed before any merge attempt."
            echo "- See docs/UPSTREAM_SYNC.md (Troubleshooting) for recovery steps."
          } > /tmp/sync_failure.md
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "Upstream sync FAILED $(date +%Y-%m-%d)" \
            --body-file /tmp/sync_failure.md || \
            echo "::warning::Could not open the failure issue (are Issues enabled on this repo?). Check the run log."
