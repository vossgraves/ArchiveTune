name: QQ unit tests (temporary)

# Temporary, dispatch-only: the Canary workflow assembles release APKs, which never compiles
# `src/test`, so a mistake in a test file would otherwise go unnoticed. This exists to run the QQ
# Music tests once, and is removed from the branch before the final Canary build.

on: workflow_dispatch

jobs:
  qq-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set Up Gradle
        uses: actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: QQ Music unit tests
        run: ./gradlew --console=plain :app:testGmsMobileUniversalDebugUnitTest --tests "moe.rukamori.archivetune.qqmusic.*"

      - name: Whole unit-test suite (informational)
        continue-on-error: true
        run: ./gradlew --console=plain :app:testGmsMobileUniversalDebugUnitTest
