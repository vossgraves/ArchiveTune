name: Nightly (canary) build

# Produces canary/dev builds for the in-app updater's CANARY channel.
# Runs on every push to the 'dev' branch (and on demand). The updater looks for GitHub
# releases whose tag starts with "N" followed by date digits (newest wins) and whose assets
# are named app-<dist>-<device>-<abi>-nightly.apk.
on:
  push:
    branches:
      - 'dev'
  workflow_dispatch:
    inputs:
      force:
        description: 'Build even if there are no new commits since the last canary build'
        type: boolean
        default: false

concurrency:
  # Serialised, and NOT cancelling the run in flight. With cancel-in-progress, any second push
  # inside a build window (~18 minutes) killed the first one mid-build, so that commit produced no
  # APK at all — runs 172-176, 179 and 180 all died that way, which is what made shipped fixes look
  # unshipped. Queueing instead means the build already running finishes and its APK exists.
  #
  # Deliberately NOT per-commit (group: ...-${{ github.sha }}), which would let every commit build
  # in parallel: the release tag is N<yyyyMMddHHmm>, minute-granular, so two builds finishing in the
  # same minute would collide on `gh release create`. Widening the tag is not an escape — the
  # in-app updater matches it with Regex("""N\d{8}(?:\d{4})?""") and .matches(), a whole-string
  # match, so a SHA suffix or a seconds field would make every canary release invisible to already
  # installed apps. Serialised runs start >=1 build apart, so the timestamp cannot repeat.
  #
  # GitHub keeps only the newest PENDING run per group, so a burst still skips intermediate
  # commits — but the newest commit always builds, and so does whatever was already running.
  group: dev-canary
  cancel-in-progress: false

jobs:
  check:
    if: contains(github.ref, 'refs/tags') == false
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.decide.outputs.should_build }}
      nightly_tag: ${{ steps.decide.outputs.nightly_tag }}
      nightly_name: ${{ steps.decide.outputs.nightly_name }}
      version_name: ${{ steps.decide.outputs.version_name }}
      version_code: ${{ steps.decide.outputs.version_code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide whether to build
        id: decide
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          set -euo pipefail

          # Timestamped tag: N<yyyyMMddHHmm>. The updater sorts canary releases by the numeric
          # digits after the leading "N", so a lexical/numeric timestamp gives correct ordering.
          TS="$(date -u +'%Y%m%d%H%M')"
          NIGHTLY_TAG="N${TS}"
          BASE_VERSION="$(grep -oP 'baseVersionName\s*=\s*"\K[^"]+' app/build.gradle.kts || echo '0.0.0')"
          MAJOR_MINOR="$(echo "$BASE_VERSION" | cut -d. -f1-2)"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          COMMIT_COUNT="$(git rev-list --count HEAD)"

          # Canary builds all share the fixed display versionName from build.gradle.kts (e.g.
          # "13.7.5"); they are told apart internally by the monotonic versionCode (the commit
          # count). The in-app updater embeds that versionCode in the release notes ("at-build:<n>")
          # and compares build numbers, so the fixed versionName never triggers a false "update
          # available" while genuinely newer builds still do.
          echo "nightly_tag=${NIGHTLY_TAG}" >> "$GITHUB_OUTPUT"
          echo "nightly_name=Canary ${MAJOR_MINOR}.${COMMIT_COUNT}-${SHORT_SHA} (${TS})" >> "$GITHUB_OUTPUT"
          echo "version_name=${BASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_code=${COMMIT_COUNT}" >> "$GITHUB_OUTPUT"

          if [ "${FORCE:-false}" = "true" ]; then
            echo "Forced build requested."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Find the most recent existing nightly release (tag starting with N + digits).
          LAST_NIGHTLY_SHA=""
          LAST_TAG="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | test("^N[0-9]+"))] | sort_by(.createdAt) | last | .tagName' 2>/dev/null || true)"
          if [ -n "${LAST_TAG:-}" ] && [ "$LAST_TAG" != "null" ]; then
            LAST_NIGHTLY_SHA="$(gh release view "$LAST_TAG" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq '.targetCommitish' 2>/dev/null || true)"
          fi

          if [ -z "${LAST_NIGHTLY_SHA:-}" ]; then
            echo "No previous nightly found; building."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Resolve the target ref to a commit and compare with HEAD.
          if git cat-file -e "${LAST_NIGHTLY_SHA}^{commit}" 2>/dev/null; then
            if [ "$(git rev-parse HEAD)" = "$(git rev-parse "${LAST_NIGHTLY_SHA}^{commit}")" ]; then
              echo "No new commits since last nightly ($LAST_TAG); skipping."
              echo "should_build=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "New commits since last nightly ($LAST_TAG); building."
          echo "should_build=true" >> "$GITHUB_OUTPUT"

  build:
    name: Build Nightly APKs
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION_NAME_OVERRIDE: ${{ needs.check.outputs.version_name }}
      VERSION_CODE_OVERRIDE: ${{ needs.check.outputs.version_code }}
      NIGHTLY_BUILD_HASH: ${{ github.sha }}
      # Marks the APK as a canary/nightly build (BuildConfig.IS_NIGHTLY). Drives the default update
      # channel and the build-number-based canary update comparison.
      IS_NIGHTLY_BUILD: 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: mobile
            distribution: gms
            distributionName: Gms
            deviceName: Mobile
            abi: arm64
          - device: mobile
            distribution: gms
            distributionName: Gms
            deviceName: Mobile
            abi: armeabi
          - device: mobile
            distribution: gms
            distributionName: Gms
            deviceName: Mobile
            abi: x86
          - device: mobile
            distribution: gms
            distributionName: Gms
            deviceName: Mobile
            abi: x86_64
          - device: mobile
            distribution: gms
            distributionName: Gms
            deviceName: Mobile
            abi: universal
          - device: tv
            distribution: gms
            distributionName: Gms
            deviceName: Tv
            abi: universal
          - device: mobile
            distribution: foss
            distributionName: Foss
            deviceName: Mobile
            abi: universal

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Resolve variant names
        id: variant
        shell: bash
        run: |
          set -euo pipefail
          DISTRIBUTION="${{ matrix.distribution }}"
          DISTRIBUTION_CAP="${{ matrix.distributionName }}"
          DEVICE="${{ matrix.device }}"
          ABI="${{ matrix.abi }}"
          DEVICE_CAP="${{ matrix.deviceName }}"
          ABI_CAP="$(tr '[:lower:]' '[:upper:]' <<< "${ABI:0:1}")${ABI:1}"
          echo "distribution=$DISTRIBUTION" >> "$GITHUB_OUTPUT"
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"
          echo "abi=$ABI" >> "$GITHUB_OUTPUT"
          echo "device_cap=$DEVICE_CAP" >> "$GITHUB_OUTPUT"
          echo "abi_cap=$ABI_CAP" >> "$GITHUB_OUTPUT"
          echo "gradle_task=assemble${DISTRIBUTION_CAP}${DEVICE_CAP}${ABI_CAP}Release" >> "$GITHUB_OUTPUT"
          # Nightly asset name expected by the updater's canary channel.
          echo "artifact_name=app-${DISTRIBUTION}-${DEVICE}-${ABI}-nightly" >> "$GITHUB_OUTPUT"
          echo "apk_name=app-${DISTRIBUTION}-${DEVICE}-${ABI}-nightly.apk" >> "$GITHUB_OUTPUT"

      - name: Build Release APK
        shell: bash
        run: |
          set -euo pipefail
          GRADLE_TASK="${{ steps.variant.outputs.gradle_task }}"
          ./gradlew "$GRADLE_TASK"
        env:
          PULL_REQUEST: 'false'
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          TOGETHER_BEARER_TOKEN: ${{ secrets.TOGETHER_BEARER_TOKEN }}
          CANVAS_BEARER_TOKEN: ${{ secrets.CANVAS_BEARER_TOKEN }}
          EXTRACTOR_BEARER: ${{ secrets.EXTRACTOR_BEARER }}
          START_IO_APP_ID: ${{ secrets.START_IO_APP_ID }}
          # Public base URL of the community Source Pool site. Prefer the Actions variable
          # (non-sensitive), but fall back to the secret of the same name for forks that stored
          # it as a secret. The gradle default applies when neither is set.
          SOURCE_PROVIDER_URL: ${{ vars.SOURCE_PROVIDER_URL || secrets.SOURCE_PROVIDER_URL }}
          # Per-app read key for the pool (secret). Blank is fine while the pool runs unenforced.
          SOURCE_PROVIDER_KEY: ${{ secrets.SOURCE_PROVIDER_KEY }}
          # POOL_CLIENT_KEY not needed: v2 feed protocol derives encryption from the read key.

      - name: Resolve release output directory
        id: release_dir
        shell: bash
        run: |
          set -euo pipefail
          DISTRIBUTION="${{ steps.variant.outputs.distribution }}"
          DEVICE="${{ steps.variant.outputs.device }}"
          ABI="${{ steps.variant.outputs.abi }}"
          DEVICE_CAP="${{ steps.variant.outputs.device_cap }}"
          ABI_CAP="${{ steps.variant.outputs.abi_cap }}"
          CANDIDATES=(
            "app/build/outputs/apk/${DISTRIBUTION}${DEVICE_CAP}${ABI_CAP}/release"
            "app/build/outputs/apk/${DISTRIBUTION}${DEVICE}${ABI_CAP}/release"
            "app/build/outputs/apk/${DISTRIBUTION}/${DEVICE}/${ABI}/release"
            "app/build/outputs/apk/${DISTRIBUTION}/${DEVICE}${ABI_CAP}/release"
            "app/build/outputs/apk/${DISTRIBUTION}/${DEVICE_CAP}${ABI_CAP}/release"
            "app/build/outputs/apk/gms${DEVICE_CAP}${ABI_CAP}/release"
            "app/build/outputs/apk/gms${DEVICE}${ABI_CAP}/release"
            "app/build/outputs/apk/gms/${DEVICE}/${ABI}/release"
            "app/build/outputs/apk/gms/${DEVICE}${ABI_CAP}/release"
            "app/build/outputs/apk/gms/${DEVICE_CAP}${ABI_CAP}/release"
            "app/build/outputs/apk/${DEVICE}/${ABI}/release"
            "app/build/outputs/apk/${DEVICE}${ABI_CAP}/release"
            "app/build/outputs/apk/${DEVICE_CAP}${ABI_CAP}/release"
            "app/build/outputs/apk/${ABI}/${DEVICE}/release"
          )
          for d in "${CANDIDATES[@]}"; do
            if [ -d "$d" ]; then
              echo "release_dir=$d" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          FOUND_METADATA="$(
            find app/build/outputs/apk -type f -name "output-metadata.json" \
              \( \
                -path "*/${DISTRIBUTION}/${DEVICE}/${ABI}/release/output-metadata.json" -o \
                -path "*/${DISTRIBUTION}${DEVICE}${ABI_CAP}/release/output-metadata.json" -o \
                -path "*/${DISTRIBUTION}${DEVICE_CAP}${ABI_CAP}/release/output-metadata.json" -o \
                -path "*/${DEVICE}/${ABI}/release/output-metadata.json" -o \
                -path "*/${DEVICE}${ABI_CAP}/release/output-metadata.json" -o \
                -path "*/${DEVICE_CAP}${ABI_CAP}/release/output-metadata.json" \
              \) \
              | head -n 1 || true
          )"
          if [ -n "${FOUND_METADATA:-}" ]; then
            echo "release_dir=$(dirname "$FOUND_METADATA")" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Could not resolve APK release output directory for DISTRIBUTION=$DISTRIBUTION DEVICE=$DEVICE ABI=$ABI"
          find app/build/outputs/apk -maxdepth 8 -type d -print || true
          exit 1

      - name: Verify nightly signing secrets
        shell: bash
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for var in KEYSTORE KEY_ALIAS KEYSTORE_PASSWORD KEY_PASSWORD; do
            if [ -z "${!var:-}" ]; then
              echo "::error::Missing required secret $var for nightly signing. Configure KEYSTORE, KEY_ALIAS, KEYSTORE_PASSWORD, and KEY_PASSWORD as GitHub Actions secrets. The committed debug keystore fallback was removed."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "Nightly signing secrets present."

      - name: Sign APK (release keystore)
        uses: ilharp/sign-android-release@v2.0.0
        with:
          releaseDir: ${{ steps.release_dir.outputs.release_dir }}/
          signingKey: ${{ secrets.KEYSTORE }}
          keyAlias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
          buildToolsVersion: 35.0.0

      - name: Move and rename APK
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_DIR="${{ steps.release_dir.outputs.release_dir }}"
          mkdir -p "$RELEASE_DIR/out"
          mapfile -t SIGNED_APKS < <(
            find "$RELEASE_DIR" -maxdepth 1 -type f \
              \( -name "*-signed.apk" -o -name "*-unsigned-signed.apk" \)
          )
          if [ "${#SIGNED_APKS[@]}" -ne 1 ]; then
            echo "Expected exactly one signed APK in $RELEASE_DIR, found ${#SIGNED_APKS[@]}"
            find "$RELEASE_DIR" -maxdepth 2 -type f -print || true
            exit 1
          fi
          APK="${SIGNED_APKS[0]}"
          mv "$APK" "$RELEASE_DIR/out/${{ steps.variant.outputs.apk_name }}"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.variant.outputs.artifact_name }}
          path: ${{ steps.release_dir.outputs.release_dir }}/out/${{ steps.variant.outputs.apk_name }}

  create-nightly:
    needs: [check, build]
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download all APKs
        uses: actions/download-artifact@v8
        with:
          path: downloaded_artifacts/

      - name: Build changelog since last nightly
        id: changelog
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          VERSION_CODE: ${{ needs.check.outputs.version_code }}
        run: |
          set -euo pipefail
          LAST_TAG="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | test("^N[0-9]+"))] | sort_by(.createdAt) | last | .tagName' 2>/dev/null || true)"
          {
            echo "# Nightly build"
            echo ""
            echo "Automated canary build from the dev branch. Not intended for production use."
            echo ""
            # Machine-readable monotonic build number read by the in-app updater to compare canary
            # builds (the display versionName is fixed, so the updater compares this instead).
            echo "<!-- at-build:${VERSION_CODE} -->"
            echo ""
            echo "## Pull requests"
          } > nightly_notes.md
          # List merged PRs into the dev branch since the last nightly tag (or the
          # last 30 PRs if there's no prior tag). PR titles give users a
          # human-readable summary of what changed, complementing the raw commit
          # log below.
          if [ -n "${LAST_TAG:-}" ] && [ "$LAST_TAG" != "null" ] && git rev-parse "$LAST_TAG" >/dev/null 2>&1; then
            MERGE_BASE="$(git merge-base "$LAST_TAG" HEAD)"
            gh pr list --repo "$GITHUB_REPOSITORY" --base dev --state merged \
              --search "merged:>=${MERGE_BASE}" \
              --json title,number,author \
              --template '{{range .}}- {{.title}} (#{{.number}}) — @{{.author.login}}{{"\n"}}{{end}}' >> nightly_notes.md || true
          else
            gh pr list --repo "$GITHUB_REPOSITORY" --base dev --state merged --limit 30 \
              --json title,number,author \
              --template '{{range .}}- {{.title}} (#{{.number}}) — @{{.author.login}}{{"\n"}}{{end}}' >> nightly_notes.md || true
          fi
          {
            echo ""
            echo "## Commits"
          } >> nightly_notes.md
          if [ -n "${LAST_TAG:-}" ] && [ "$LAST_TAG" != "null" ] && git rev-parse "$LAST_TAG" >/dev/null 2>&1; then
            # -n 500 caps the list: after a large sync jump the range can contain thousands of
            # commits and the release body would exceed GitHub's 125k-character limit.
            git log --pretty=format:'- %s (%h)' -n 500 "${LAST_TAG}..HEAD" >> nightly_notes.md || true
          else
            git log --pretty=format:'- %s (%h)' -n 30 >> nightly_notes.md || true
          fi
          echo "" >> nightly_notes.md
          # Hard guarantee against GitHub's 125k-character release-body limit.
          head -c 120000 nightly_notes.md > nightly_notes.tmp && mv nightly_notes.tmp nightly_notes.md

      - name: Create nightly prerelease
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          NIGHTLY_TAG: ${{ needs.check.outputs.nightly_tag }}
          NIGHTLY_NAME: ${{ needs.check.outputs.nightly_name }}
        run: |
          set -euo pipefail
          MOBILE_UNIVERSAL_APK="$(find downloaded_artifacts/app-gms-mobile-universal-nightly -name '*.apk' | head -n 1)"
          OTHER_APKS="$(find downloaded_artifacts -path '*/app-*-nightly/*.apk' ! -path '*/app-gms-mobile-universal-nightly/*')"

          gh release create "$NIGHTLY_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "${{ github.sha }}" \
            --title "$NIGHTLY_NAME" \
            --notes-file nightly_notes.md \
            --prerelease \
            "$MOBILE_UNIVERSAL_APK" \
            $OTHER_APKS

      - name: Prune old nightly prereleases (keep newest 5)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Delete all but the 5 most recent nightly (N*) releases and their tags.
          mapfile -t OLD < <(
            gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName,createdAt \
              --jq '[.[] | select(.tagName | test("^N[0-9]+"))] | sort_by(.createdAt) | reverse | .[5:] | .[].tagName'
          )
          for tag in "${OLD[@]:-}"; do
            [ -z "$tag" ] && continue
            echo "Deleting old nightly: $tag"
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          done
