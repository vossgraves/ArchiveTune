# Debug APK for on-device/emulator testing of this working branch.
# Deliberately minimal and branch-scoped: builds the mobile UNIVERSAL debug
# variant (universal ABI so it runs on an x86_64 emulator) with no signing,
# no secrets, no release/notify side effects — just an artifact the test box
# downloads. Not for shipping; the real release matrix lives in build.yml.
name: Test APK (debug)

on:
  workflow_dispatch:
  push:
    branches: [ 'fix/seek-audio-and-ui' ]
    paths-ignore:
      - '**/*.md'

permissions:
  contents: read

jobs:
  debug-apk:
    name: Build gms-mobile-universal debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Assemble debug APK
        run: ./gradlew :app:assembleGmsMobileUniversalDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: gms-mobile-universal-debug
          path: app/build/outputs/apk/**/debug/*.apk
          if-no-files-found: error
